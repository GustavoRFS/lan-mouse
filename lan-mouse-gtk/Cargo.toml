[package]
name = "lan-mouse-gtk"
description = "GTK4 / Libadwaita Frontend for lan-mouse"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
gtk = { package = "gtk4", version = "0.9.0", features = ["v4_8"] }
adw = { package = "libadwaita", version = "0.7.0", features = ["v1_1"] }
async-channel = { version = "2.1.1" }
hostname = "0.4.0"
log = "0.4.20"
base64 = "0.22.1"
sha2 = "0.10.8"
tempfile = "3.10.1"
lan-mouse-ipc = { path = "../lan-mouse-ipc", version = "0.4.0" }
lan-mouse-proto = { path = "../lan-mouse-proto", version = "0.4.0" }
lan-mouse-transfer = { path = "../lan-mouse-transfer", version = "0.1.0" }
thiserror = "2.0.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_Marshal",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# required by the `#[implement]` macro for COM objects
windows-core = "0.61.2"

[target.'cfg(windows)'.dev-dependencies]
rcgen = "0.13.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[build-dependencies]
glib-build-tools = { version = "0.20.0" }
